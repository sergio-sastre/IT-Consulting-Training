<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sergio Sastre Flórez</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      background-color: #ffffff;
      color: #18181b;
    }

    main {
      max-width: 38rem;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 1rem;
      font-size: 1.0625rem;
    }

    p:last-child {
      margin-bottom: 0;
      color: #52525b;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #09090b;
        color: #f4f4f5;
      }

      p:last-child {
        color: #a1a1aa;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sergio Sastre Flórez</h1>
    <p>
      Android developer, consultant, and technical lead. I work with Kotlin,
      Jetpack Compose, Compose Multiplatform, testing, and developer tooling.
    </p>
    <p>My personal website is coming soon.</p>
  </main>
</body>
</html>
